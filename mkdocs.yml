site_name: TechStuffs
site_description: Notes and guides on coding, architecture, DevOps and tooling
site_url: https://uthuyn.github.io/tech-stuffs/
repo_url: https://github.com/uthuyn/tech-stuffs
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search

exclude_docs: |
  templates/

nav:
  - Home: index.md
  - Coding: coding/index.md
  - Architecture: architecture/index.md
  - DevOps: devops/index.md
  - Tools:
      - tools/index.md
      - Remote Desktop macOS to Ubuntu: tools/macos-windows-app-rdp-to-ubuntu-26.04.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
